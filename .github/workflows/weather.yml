name: weather-every-3h

on:
  schedule:
    # UTC. 7,10,13,16,19,22,1,4 giờ Việt Nam. GitHub có thể trễ vài phút.
    - cron: "7 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather-notify
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python notify.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      - name: Lưu vị trí mới
        run: |
          git config user.name "meridian"
          git config user.email "meridian@users.noreply.github.com"
          git add subscribers.json
          if git diff --cached --quiet; then
            echo "Vị trí không đổi"
          else
            git commit -m "Save Telegram locations"
            git push
          fi
